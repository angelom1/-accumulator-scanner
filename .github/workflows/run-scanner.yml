name: Run Accumulator Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "35 9 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scanner.py

      - name: Save signals.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signals.json

          if git diff --cached --quiet; then
            echo "No changes to signals.json"
          else
            git commit -m "Update accumulator signals"
            git push
          fi

      - name: Upload signals backup
        uses: actions/upload-artifact@v4
        with:
          name: accumulator-signals
          path: signals.json
